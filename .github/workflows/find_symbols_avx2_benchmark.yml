name: find_symbols AVX2 benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check CPU features
        run: |
          uname -a
          lscpu | grep -E 'Model name|Flags' | head -2
          lscpu | grep -qw avx2

      - name: Build benchmark
        run: |
          clang++ -std=c++20 -O3 -DNDEBUG -march=x86-64-v3 \
            -I base benchmarks/find_symbols_avx2.cpp \
            -o find_symbols_avx2

      - name: Run benchmark
        run: ./find_symbols_avx2
