name: Temporary ClickHouse PR rebase 20260928
on:
  push:
    branches: [maintenance/rebase-open-prs-20260928]
    paths: [.github/workflows/rebase-open-prs-20260928.yml]
permissions:
  contents: write
concurrency:
  group: clickhouse-open-pr-rebase-20260928
  cancel-in-progress: false
jobs:
  rebase:
    if: github.repository == 'fallintoplace/ClickHouse'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Rebase only patch-equivalent branches with backups and leases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -u - <<'PY'
          import ast
          import base64
          import concurrent.futures
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import urllib.request
          import xml.etree.ElementTree as ET

          UPSTREAM = 'ClickHouse/ClickHouse'
          FORK = 'fallintoplace/ClickHouse'
          PIN = '2f953ee475f83d534261bbfdc91d26d789f6896c'
          ALLOWED = {122121,121646,121644,121417,121377,121372,121251,121244,121118,121117,121112,121106,121103,121099,121094,121093,121063,121029,121014,120946,120925,120914,120750,120749,120708,120707,120694,120659,120658,120657,120651,120484,120445,120444,120306,120198,120097,120057,120051,119901,119842,119841,119838,119831,119819,119816,119805,119804,119787,119770,119769,119710,119709,119698,119672,119661,119462,119318,119316,119090,118857,118190,118182,118163,117876,117787,117591,116792,116658,116010,116009,115907,115903,115849,115656,115519,115476,115374,115223,115219,115206,115200,115199,115053,115051,115048,115046,115024,115014,114704,114376,114251,113726,113721,113582,113201}
          ROOT = Path(os.environ['RUNNER_TEMP']) / 'clickhouse-rebase'
          ROOT.mkdir()
          RESULT = {'base': PIN, 'results': [], 'validation': 'git diff --check, exact added/deleted-line equivalence, Python AST/XML/shell syntax; no ClickHouse compilation or SQL execution'}
          START = time.monotonic()
          TOKEN = os.environ['GH_TOKEN']
          GIT_ENV = dict(os.environ, GIT_TERMINAL_PROMPT='0', GIT_EDITOR='true', GIT_SEQUENCE_EDITOR='true', GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/fallintoplace/ClickHouse.git.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + TOKEN).encode()).decode())

          def api(path):
              request = urllib.request.Request('https://api.github.com/' + path, headers={'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json', 'User-Agent': 'clickhouse-pr-rebase'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)

          def git(*args, check=True, input=None, timeout=240, env=None):
              p = subprocess.run(['git', *args], cwd=ROOT, env=env or GIT_ENV, input=input, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=timeout)
              if check and p.returncode:
                  raise RuntimeError('git ' + ' '.join(args[:4]) + ': ' + p.stderr.decode(errors='replace')[-5000:])
              return p

          def out(*args):
              return git(*args).stdout.decode().strip()

          def record(data):
              RESULT['results'].append(data)
              print('PR_RESULT ' + json.dumps(data), flush=True)

          def identity(pr):
              return (pr['state'] == 'open' and pr['user']['login'] == 'fallintoplace'
                      and pr['head'].get('repo') and pr['head']['repo']['full_name'] == FORK
                      and pr['base']['repo']['full_name'] == UPSTREAM and pr['base']['ref'] == 'master'
                      and pr['head']['ref'] != 'master')

          def signature(base, head):
              patch = git('diff', '--no-ext-diff', '--no-textconv', '--no-renames', '--binary', '--unified=0', base, head, '--').stdout
              return b'\n'.join(line for line in patch.split(b'\n') if not line.startswith((b'index ', b'@@ ')))

          def syntax_checks(head, paths):
              checks = []
              for path in paths:
                  if not path.endswith(('.py', '.sh', '.xml')):
                      continue
                  p = git('show', head + ':' + path, check=False)
                  if p.returncode:
                      continue
                  if path.endswith('.py'):
                      ast.parse(p.stdout, filename=path)
                  elif path.endswith('.xml'):
                      ET.fromstring(p.stdout)
                  else:
                      test = subprocess.run(['bash', '-n'], input=p.stdout, capture_output=True, timeout=20)
                      if test.returncode:
                          raise RuntimeError(path + ': ' + test.stderr.decode(errors='replace')[:2000])
                  checks.append(path)
              return checks

          def save_result():
              helper = os.environ['GITHUB_SHA']
              branch = os.environ['GITHUB_REF_NAME']
              git('fetch', '--no-tags', 'origin', helper)
              blob = git('hash-object', '-w', '--stdin', input=json.dumps(RESULT, indent=2).encode()).stdout.decode().strip()
              index_env = dict(GIT_ENV, GIT_INDEX_FILE=str(ROOT / 'result-index'))
              git('read-tree', helper, env=index_env)
              git('update-index', '--add', '--cacheinfo', '100644,' + blob + ',rebase-results.json', env=index_env)
              tree = git('write-tree', env=index_env).stdout.decode().strip()
              commit = out('commit-tree', tree, '-p', helper, '-m', 'Record ClickHouse PR rebase results')
              git('push', '--force-with-lease=refs/heads/' + branch + ':' + helper, 'origin', commit + ':refs/heads/' + branch)
              print('AUDIT_COMMIT ' + commit, flush=True)

          try:
              git('init')
              git('config', 'user.name', 'github-actions[bot]')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('config', 'core.hooksPath', '/dev/null')
              git('config', 'gc.auto', '0')
              git('remote', 'add', 'upstream', 'https://github.com/' + UPSTREAM + '.git')
              git('remote', 'add', 'origin', 'https://github.com/' + FORK + '.git')
              git('config', 'remote.upstream.promisor', 'true')
              git('config', 'remote.upstream.partialclonefilter', 'blob:none')
              git('config', 'remote.origin.promisor', 'true')
              git('config', 'remote.origin.partialclonefilter', 'blob:none')
              git('config', 'core.sparseCheckout', 'true')
              (ROOT / '.git/info/sparse-checkout').write_text('!/*\n')
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  prs = list(pool.map(lambda n: api('repos/' + UPSTREAM + '/pulls/' + str(n)), sorted(ALLOWED, reverse=True)))
              prs = [pr for pr in prs if identity(pr)]
              print('ELIGIBLE_PRS ' + str(len(prs)), flush=True)
              git('fetch', '--filter=blob:none', '--no-tags', '--shallow-since=2026-07-01', 'upstream', '+refs/heads/master:refs/remotes/upstream/master', timeout=600)
              git('cat-file', '-e', PIN + '^{commit}')
              refs = ['+refs/heads/' + pr['head']['ref'] + ':refs/remotes/origin/pr-' + str(pr['number']) for pr in prs]
              git('fetch', '--filter=blob:none', '--no-tags', '--shallow-since=2026-07-01', 'origin', *refs, timeout=600)
              for pr in prs:
                  n, branch, old = pr['number'], pr['head']['ref'], pr['head']['sha']
                  item = {'pr': n, 'branch': branch, 'old': old}
                  if time.monotonic() - START > 1400:
                      item['status'] = 'not_attempted_time_limit'
                      record(item)
                      continue
                  try:
                      fetched = out('rev-parse', 'refs/remotes/origin/pr-' + str(n))
                      if fetched != old:
                          item['status'] = 'skipped_concurrent_update'
                          record(item)
                          continue
                      base = out('merge-base', PIN, old)
                      item['previous_base'] = base
                      if base == PIN:
                          item['status'] = 'already_current'
                          record(item)
                          continue
                      commits = int(out('rev-list', '--count', base + '..' + old))
                      if commits > 100:
                          item.update(status='skipped_complex_history', commits=commits)
                          record(item)
                          continue
                      paths = git('diff', '--name-only', '--no-renames', '-z', base, old).stdout.decode().strip('\0').split('\0')
                      if any(p.startswith('.github/workflows/') for p in paths):
                          item['status'] = 'skipped_pr_workflow_changes'
                          record(item)
                          continue
                      original = signature(base, old)
                      if not original:
                          item['status'] = 'already_applied_or_empty'
                          record(item)
                          continue
                      git('checkout', '--detach', old)
                      rebase = git('rebase', '--rebase-merges=no-rebase-cousins', '--onto', PIN, base, check=False)
                      if rebase.returncode:
                          item.update(status='conflict', files=out('diff', '--name-only', '--diff-filter=U').splitlines(), detail=rebase.stderr.decode(errors='replace')[-3500:])
                          git('rebase', '--abort', check=False)
                          record(item)
                          continue
                      new = out('rev-parse', 'HEAD')
                      item['candidate'] = new
                      if signature(PIN, new) != original:
                          item['status'] = 'skipped_patch_changed'
                          record(item)
                          continue
                      git('diff', '--check', PIN, new)
                      item['syntax_checked'] = syntax_checks(new, paths)
                      item['changed_files'] = len(paths)
                      current = api('repos/' + UPSTREAM + '/pulls/' + str(n))
                      if not identity(current) or current['head']['sha'] != old or current['head']['ref'] != branch:
                          item['status'] = 'skipped_concurrent_update'
                          record(item)
                          continue
                      backup = 'maintenance/rebase-backups/' + os.environ['GITHUB_RUN_ID'] + '/pr-' + str(n)
                      git('push', '--force-with-lease=refs/heads/' + backup + ':', 'origin', old + ':refs/heads/' + backup)
                      item['backup'] = backup
                      git('push', '--force-with-lease=refs/heads/' + branch + ':' + old, 'origin', new + ':refs/heads/' + branch)
                      remote = out('ls-remote', 'origin', 'refs/heads/' + branch).split()[0]
                      if remote != new:
                          item['status'] = 'pushed_but_remote_changed'
                      else:
                          item.update(status='rebased_and_pushed', new=new)
                      record(item)
                  except Exception as exc:
                      git('rebase', '--abort', check=False)
                      item.update(status='error', detail=str(exc)[:5000])
                      record(item)
              save_result()
          except Exception as exc:
              RESULT['fatal_error'] = str(exc)
              print('FATAL_ERROR ' + str(exc), flush=True)
          finally:
              print('FINAL_RESULTS ' + json.dumps(RESULT), flush=True)
              Path(os.environ['RUNNER_TEMP'], 'rebase-results.json').write_text(json.dumps(RESULT, indent=2))
          if 'fatal_error' in RESULT:
              raise SystemExit(1)
          PY
