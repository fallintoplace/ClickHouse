name: Verify PromQL 115199
on:
  push:
    branches: [tmp/verify-promql-115199]
    paths: [.github/workflows/verify-promql-115199.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read failing integration test logs
        shell: bash
        run: |
          set -euo pipefail
          base='https://s3.amazonaws.com/clickhouse-test-reports/115199/d603a51a0ba71074a0cc0c930ea0a2d92ff3845e/integration_tests__amd_asan_ubsan__targeted_'
          for test in test_histogram_quantile test_histogram_quantile_with_float32_scalar; do
            echo "::group::$test"
            curl --fail --silent --show-error --retry 2 "$base/test_prometheus_protocols_test_evaluation_${test}_0.log.zst" | zstd --decompress --stdout | tail -250
            echo '::endgroup::'
          done
