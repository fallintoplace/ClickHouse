name: Verify PromQL 115199
on:
  push:
    branches: [tmp/verify-promql-115199]
    paths: [.github/workflows/verify-promql-115199.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/promql-histogram-grid-state
          fetch-depth: 1
          sparse-checkout: |
            src/AggregateFunctions
            tests/queries/0_stateless
            tests/integration/test_prometheus_protocols
      - name: Guard reviewed head
        run: test "$(git rev-parse HEAD)" = d603a51a0ba71074a0cc0c930ea0a2d92ff3845e
      - name: Patch and validate merge preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('src/AggregateFunctions/AggregateFunctionQuantilePrometheusHistogram.cpp')
          source = p.read_text()
          old = 'return present[index] != 0;'
          new = 'return index < present.size() && present[index] != 0;'
          assert source.count(old) == 1
          anchor = '    String getName() const override { return NameQuantilePrometheusHistogramArray::name; }'
          assert source.count(anchor) == 1
          quantile = Path('src/AggregateFunctions/AggregateFunctionQuantile.h').read_text()
          printer = '    bool shouldPrintParametersWithTypes() const override { return true; }'
          assert printer in quantile
          def method(text, signature):
              start = text.index(signature)
              pos = text.index('{', start)
              depth = 1
              end = pos + 1
              while depth:
                  depth += (text[end] == '{') - (text[end] == '}')
                  end += 1
              return text[start:end]
          def harness(text):
              methods = '\n'.join([
                  method(text, 'bool contains(size_t index) const'),
                  method(text, 'size_t countNewValues(const Bucket & rhs, size_t rhs_grid_size) const'),
                  'template <typename Func>\n' + method(text, 'void forEach(size_t grid_size_, Func && func) const')])
              return '''#include <algorithm>
          #include <cassert>
          #include <cstdint>
          #include <vector>
          using UInt32 = uint32_t;
          using CumulativeHistogramValue = double;
          struct Bucket {
              struct SparseValue { UInt32 index; double value; };
              bool dense = false;
              std::vector<double> values;
              std::vector<uint8_t> present;
              std::vector<SparseValue> sparse_values;
          ''' + methods + '''
          };
          int main() {
              Bucket shorter;
              shorter.dense = true;
              shorter.values = {1, 1, 0};
              shorter.present = {1, 1, 0};
              Bucket longer_sparse;
              longer_sparse.sparse_values = {{3, 1}};
              assert(shorter.countNewValues(longer_sparse, 4) == 1);
              assert(!shorter.contains(3));
              assert(!shorter.contains(100));
              assert(shorter.contains(0));
              assert(!shorter.contains(2));
              assert(longer_sparse.countNewValues(shorter, 3) == 2);
              Bucket longer_dense;
              longer_dense.dense = true;
              longer_dense.values = {1, 0, 1, 1};
              longer_dense.present = {1, 0, 1, 1};
              assert(shorter.countNewValues(longer_dense, 4) == 2);
              assert(longer_dense.countNewValues(shorter, 3) == 1);
              assert(shorter.countNewValues(shorter, 3) == 0);
              Bucket empty;
              assert(empty.countNewValues(longer_dense, 4) == 3);
          }
          '''
          def compile_and_run(text, name):
              cpp = Path('/tmp/' + name + '.cpp')
              cpp.write_text(harness(text))
              exe = '/tmp/' + name
              subprocess.run(['clang++', '-std=c++20', '-O1', '-g', '-Wall', '-Wextra', '-Werror', '-fsanitize=address,undefined', '-fno-omit-frame-pointer', str(cpp), '-o', exe], check=True)
              return subprocess.run([exe], capture_output=True, text=True)
          before = compile_and_run(source, 'histogram-before')
          assert before.returncode != 0 and 'heap-buffer-overflow' in before.stderr, before.stderr
          print('PASS: exact unpatched Bucket methods reproduce ASan heap-buffer-overflow')
          source = source.replace(old, new).replace(anchor, anchor + '\n\n' + printer)
          after = compile_and_run(source, 'histogram-after')
          assert after.returncode == 0, after.stderr
          print('PASS: patched Bucket methods pass ASan/UBSan sparse, dense, reverse, equal and empty preflights')
          p.write_text(source)
          PY
      - name: Add focused SQL regressions
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/queries/0_stateless/03601_histogram_quantile_array_regressions.sql <<'SQL'
          -- Force a three-point dense destination to merge a four-point sparse source.
          -- arrayReduce fixes the merge order rather than relying on UNION ALL scheduling.
          DROP TABLE IF EXISTS histogram_grid_merge_states;
          CREATE TABLE histogram_grid_merge_states ENGINE = Memory AS
          SELECT part, quantilePrometheusHistogramArrayState(0.5)(le, values) AS state
          FROM
          (
              SELECT 0 AS part, arrayJoin([1., inf]) AS le,
                  CAST(if(isFinite(le), [1., 1., NULL], [2., 2., NULL]), 'Array(Nullable(Float64))') AS values
              UNION ALL
              SELECT 1 AS part, arrayJoin([1., inf]) AS le,
                  CAST(if(isFinite(le), [NULL, NULL, NULL, 1.], [NULL, NULL, NULL, 2.]), 'Array(Nullable(Float64))') AS values
          )
          GROUP BY part;

          WITH
              (SELECT state FROM histogram_grid_merge_states WHERE part = 0) AS shorter,
              (SELECT state FROM histogram_grid_merge_states WHERE part = 1) AS longer
          SELECT
              arrayMap(x -> if(isNaN(x), -1., x), arrayReduce('quantilePrometheusHistogramArrayMerge(0.5)', [shorter, longer])),
              arrayMap(x -> if(isNaN(x), -1., x), arrayReduce('quantilePrometheusHistogramArrayMerge(0.5)', [longer, shorter]));
          DROP TABLE histogram_grid_merge_states;

          -- CTAS must be able to reparse state types with integer and Decimal parameters.
          DROP TABLE IF EXISTS histogram_grid_typed_states;
          CREATE TABLE histogram_grid_typed_states ENGINE = Memory AS
          SELECT
              quantilePrometheusHistogramArrayState(1)(pair.1, [pair.2]) AS integer_state,
              quantilePrometheusHistogramArrayState(toDecimal64('0.25', 2))(pair.1, [pair.2]) AS decimal_state
          FROM (SELECT arrayJoin([(1., 1.), (inf, 2.)]) AS pair);

          SELECT finalizeAggregation(integer_state), finalizeAggregation(decimal_state)
          FROM histogram_grid_typed_states;
          SELECT
              quantilePrometheusHistogramArrayMerge(1)(integer_state),
              quantilePrometheusHistogramArrayMerge(toDecimal64('0.25', 2))(decimal_state)
          FROM histogram_grid_typed_states;
          DROP TABLE histogram_grid_typed_states;
          SQL
          printf '[1,1,-1,1]\t[1,1,-1,1]\n[1]\t[0.5]\n[1]\t[0.5]\n' > tests/queries/0_stateless/03601_histogram_quantile_array_regressions.reference
          python3 -m py_compile tests/integration/test_prometheus_protocols/test_evaluation.py
          git diff --check
          git diff --stat
      - name: Commit and push reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git add src/AggregateFunctions/AggregateFunctionQuantilePrometheusHistogram.cpp tests/queries/0_stateless/03601_histogram_quantile_array_regressions.sql tests/queries/0_stateless/03601_histogram_quantile_array_regressions.reference
          git diff --cached --check
          git config user.name 'Minh Vu'
          git config user.email '38443830+fallintoplace@users.noreply.github.com'
          git commit -m 'Fix histogram grid merge bounds and state parameter round trips'
          git push origin HEAD:refs/heads/perf/promql-histogram-grid-state
          git log -1 --format='%H %s'
