name: PR 121377 workbench
on:
  push:
    branches: [agent/pr121377-opt-in-20260926]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Collect source and CI diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          git clone --filter=blob:none --no-checkout --depth=32 --single-branch --branch perf/string-size-filter-only https://github.com/fallintoplace/ClickHouse.git source
          cd source
          git sparse-checkout set --no-cone '/AGENTS.md' '/.github/PULL_REQUEST_TEMPLATE.md' '/.claude/tools/' '/src/Analyzer/Passes/FunctionToSubcolumnsPass.cpp' '/src/Storages/MergeTree/MergeTreeBlockReadUtils.cpp' '/src/Core/Settings.cpp' '/src/Core/SettingsChangesHistory.cpp' '/src/Functions/empty.cpp' '/src/Functions/array/length.cpp' '/tests/queries/0_stateless/00091_prewhere_two_conditions.*' '/tests/queries/0_stateless/04032_and_comparison_filter_optimization_2.*' '/tests/queries/0_stateless/03634_autopr_input_bytes_estimation.*' '/tests/queries/0_stateless/04102_autopr_input_bytes_estimation_query_with_ctes.*' '/tests/queries/0_stateless/05234_functions_to_subcolumns_string_filter_only.*' '/tests/performance/string_size_filter_only.xml' '/tests/queries/0_stateless/add-test' '/tests/clickhouse-test' '/.clang-format' '/cmake/autogenerated_versions.txt'
          git checkout 6db2993ee79f313233f46df134f0deded10b52fe
          test "$(git rev-parse HEAD)" = 6db2993ee79f313233f46df134f0deded10b52fe
          git log -25 --format='%h %s' > ../diagnostics/history.txt
          git ls-tree -r --name-only HEAD | grep -E '(^|/)AGENTS.md$' > ../diagnostics/instruction-paths.txt || true
          for path in $(cat ../diagnostics/instruction-paths.txt); do
            case "$path" in AGENTS.md|src/AGENTS.md|src/Core/AGENTS.md|src/Analyzer/AGENTS.md|src/Analyzer/Passes/AGENTS.md|src/Functions/AGENTS.md|src/Functions/array/AGENTS.md|src/Storages/AGENTS.md|src/Storages/MergeTree/AGENTS.md|tests/AGENTS.md|tests/queries/AGENTS.md|tests/queries/0_stateless/AGENTS.md|tests/performance/AGENTS.md) printf '\nFILE %s\n' "$path" >> ../diagnostics/instructions.txt; git show "HEAD:$path" >> ../diagnostics/instructions.txt;; esac
          done
          mkdir -p tmp
          set +e
          node .claude/tools/fetch_ci_report.js 'https://s3.amazonaws.com/clickhouse-test-reports/praktika.html?PR=121377&sha=6db2993ee79f313233f46df134f0deded10b52fe&name_0=PR&name_1=Stateless%20tests%20%28amd_debug%2C%20parallel%29' --failed --links --download-logs tmp/amd_debug_logs.tar.gz > ../diagnostics/amd_debug_report.txt 2>&1
          printf '%s\n' "$?" > ../diagnostics/report-exit.txt
          set -e
          if test -f tmp/amd_debug_logs.tar.gz; then
            tar -tzf tmp/amd_debug_logs.tar.gz > ../diagnostics/archive-files.txt || true
            python3 - <<'PY'
          import pathlib, tarfile
          archive = pathlib.Path('tmp/amd_debug_logs.tar.gz')
          output = pathlib.Path('../diagnostics/test-logs')
          output.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'r:*') as tf:
              for member in tf.getmembers():
                  if member.isfile() and member.size < 20000000 and any(term in member.name for term in ('04102_', '03634_', 'test_results.tsv', 'test_result.txt')):
                      stream = tf.extractfile(member)
                      if stream:
                          (output / member.name.replace('/', '__')).write_bytes(stream.read())
          PY
          fi
          tar --exclude=.git --exclude=tmp -czf ../diagnostics/source.tar.gz .
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr121377-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 1
