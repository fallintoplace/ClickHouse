name: PR 121377 workbench
on:
  push:
    branches: [agent/pr121377-opt-in-20260926]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare and verify the reviewed change
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics source
          curl --fail --silent --show-error --retry 2 "https://raw.githubusercontent.com/fallintoplace/ClickHouse/${GITHUB_SHA}/apply_fix.py" -o diagnostics/apply_fix.py
          curl --fail --silent --show-error --retry 2 "https://raw.githubusercontent.com/fallintoplace/ClickHouse/${GITHUB_SHA}/expected.json" -o diagnostics/expected.json
          cd source
          git init -q
          git remote add origin https://github.com/fallintoplace/ClickHouse.git
          git -c protocol.version=2 fetch --filter=blob:none --depth=1 origin 6db2993ee79f313233f46df134f0deded10b52fe
          git sparse-checkout set --no-cone '/AGENTS.md' '/.claude/tools/' '/src/Analyzer/Passes/FunctionToSubcolumnsPass.cpp' '/src/Storages/MergeTree/MergeTreeBlockReadUtils.cpp' '/src/Core/Settings.cpp' '/src/Core/SettingsChangesHistory.cpp' '/src/Functions/empty.cpp' '/src/Functions/array/length.cpp' '/tests/queries/0_stateless/00091_prewhere_two_conditions.*' '/tests/queries/0_stateless/04032_and_comparison_filter_optimization_2.*' '/tests/queries/0_stateless/05234_functions_to_subcolumns_string_filter_only.*' '/tests/performance/string_size_filter_only.xml' '/.clang-format'
          git checkout --detach FETCH_HEAD
          mkdir -p tmp
          python3 ../diagnostics/apply_fix.py > ../diagnostics/validation.log 2>&1
          python3 - <<'PY' >> ../diagnostics/validation.log 2>&1
          import hashlib, json, pathlib, subprocess, xml.etree.ElementTree as ET
          expected=json.loads(pathlib.Path('../diagnostics/expected.json').read_text())
          actual=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(actual)==set(expected), (actual, list(expected))
          for path, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==digest, path
          print('All 10 changed files match the locally reviewed SHA-256 manifest.')
          root=ET.parse('tests/performance/string_size_filter_only.xml').getroot()
          guards=[e for e in root if 'do_not_check_in_pr' in e.attrib]
          assert len(guards)==1 and guards[0].tag=='create_query' and guards[0].get('do_not_check_in_pr')=='121377'
          print('The reference-build guard uses the supported setup-only attribute.')
          with pathlib.Path('../diagnostics/change.patch').open('wb') as f:
              subprocess.run(['git','diff','--binary'],stdout=f,check=True)
          with pathlib.Path('../diagnostics/change-stat.txt').open('w') as f:
              subprocess.run(['git','diff','--stat'],stdout=f,check=True)
          pathlib.Path('../diagnostics/changed-paths.txt').write_text('\n'.join(actual)+'\n')
          PY
          git diff --check
      - name: Read failing CI and check SQL syntax with the original PR binary
        shell: bash
        run: |
          set -euo pipefail
          cd source
          report='https://s3.amazonaws.com/clickhouse-test-reports/praktika.html?PR=121377&sha=6db2993ee79f313233f46df134f0deded10b52fe&name_0=PR'
          node .claude/tools/fetch_ci_report.js "${report}&name_1=Stateless%20tests%20%28amd_tsan%2C%20parallel%2C%20selected%20tests%29" --failed --links > ../diagnostics/tsan-report.txt 2>&1
          node .claude/tools/fetch_ci_report.js "${report}&name_1=Build%20%28amd_binary%29" --binary > ../diagnostics/binary-links.txt 2> ../diagnostics/binary-report.log
          python3 - <<'PY'
          import pathlib, urllib.parse, urllib.request
          links=pathlib.Path('../diagnostics/binary-links.txt').read_text().splitlines()
          urls=[u for u in links if urllib.parse.urlparse(u).scheme=='https' and pathlib.PurePosixPath(urllib.parse.urlparse(u).path).name=='clickhouse']
          assert urls, 'No concrete binary link returned by the build report'
          urllib.request.urlretrieve(urls[0], 'tmp/clickhouse')
          pathlib.Path('tmp/clickhouse').chmod(0o755)
          PY
          tmp/clickhouse --version > ../diagnostics/binary-version.txt
          python3 - <<'PY' >> ../diagnostics/validation.log 2>&1
          import pathlib, subprocess, xml.etree.ElementTree as ET
          paths=[p for p in pathlib.Path('../diagnostics/changed-paths.txt').read_text().splitlines() if p.endswith('.sql')]
          for path in paths:
              p=subprocess.run(['tmp/clickhouse','format','--multiquery','--quiet'],input=pathlib.Path(path).read_bytes(),capture_output=True)
              pathlib.Path('../diagnostics/'+pathlib.Path(path).stem+'.format.log').write_bytes(p.stdout+p.stderr)
              assert p.returncode==0, (path,p.stderr.decode(errors='replace'))
          print(f'Existing PR binary accepted the syntax of all {len(paths)} changed SQL files. SQL assertions were not executed.')
          root=ET.parse('tests/performance/string_size_filter_only.xml').getroot()
          for e in root:
              if e.tag not in ('create_query','fill_query','query','drop_query'):
                  continue
              p=subprocess.run(['tmp/clickhouse','format','--quiet'],input=(e.text or '').encode(),capture_output=True)
              assert p.returncode==0, (e.tag,p.stderr.decode(errors='replace'))
          print('All performance fixture statements pass the ClickHouse syntax parser.')
          p=subprocess.run(['tmp/clickhouse','local','--query',"SELECT count() FROM system.settings WHERE name = 'optimize_functions_to_subcolumns' AND `default` = '1'"],capture_output=True)
          pathlib.Path('../diagnostics/system-settings-check.log').write_bytes(p.stdout+p.stderr)
          assert p.returncode==0 and p.stdout.strip()==b'1', (p.returncode,p.stdout,p.stderr)
          print('Verified system.settings.default is available with the expected String representation.')
          PY
      - name: Stage a source-only result commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd source
          expected_head=6db2993ee79f313233f46df134f0deded10b52fe
          test "$(git ls-remote origin refs/heads/perf/string-size-filter-only | cut -f1)" = "$expected_head"
          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          while IFS= read -r path; do git add -- "$path"; done < ../diagnostics/changed-paths.txt
          git diff --cached --check
          git commit -m 'Make `String.size` filters with full reads opt-in' -m 'Related: https://github.com/ClickHouse/ClickHouse/pull/121377'
          test "$(git rev-parse HEAD^)" = "$expected_head"
          git rev-parse HEAD > ../diagnostics/result-commit.txt
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/agent/pr121377-result-20260926
          unset auth
          echo 'Source-only commit staged; the PR branch remains unchanged.' >> ../diagnostics/validation.log
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr121377-reviewed-change
          path: diagnostics
          if-no-files-found: error
          retention-days: 1
